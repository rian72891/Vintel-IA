name: Deploy Edge Functions (migracao)

on:
  push:
    branches: [migracao-supabase-externo]
    paths:
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy chat
        run: supabase functions deploy chat --project-ref iihpyiwgcgtvtqdxmkgo --no-verify-jwt
      - name: Deploy github-agent
        run: supabase functions deploy github-agent --project-ref iihpyiwgcgtvtqdxmkgo --no-verify-jwt
